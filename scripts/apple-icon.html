<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { width: 180px; height: 180px; overflow: hidden; }
  .tile {
    width: 180px; height: 180px;
    background: linear-gradient(160deg, #070E1A 0%, #0A1424 60%, #0D1626 100%);
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 132px; height: 132px; }
</style>
</head>
<body>
<div class="tile">
  <svg viewBox="0 0 32 32" fill="none">
    <rect x="5" y="5" width="4" height="22" rx="1" fill="#FFFFFF"/>
    <rect x="12" y="8" width="14" height="3.4" rx="1.2" fill="#FFFFFF"/>
    <rect x="12" y="14.3" width="15" height="3.4" rx="1.2" fill="#00C8FF"/>
    <rect x="12" y="20.6" width="10" height="3.4" rx="1.2" fill="#FFFFFF"/>
  </svg>
</div>
</body>
</html>
